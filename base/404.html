<!doctype html>
<!-- Página 404 — o GitHub Pages mostra este arquivo para qualquer endereço inexistente.
     Ela é autossuficiente (CSS inline) porque é servida de qualquer URL e caminhos relativos quebrariam.
     Troque {{https://URL-final-do-site/}} pela URL final (com barra no fim) na Fase 5. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada — {{Nome do negócio}}</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { --color-primary: #1d4ed8; --color-primary-strong: #1e40af; --color-text: #0f172a; --color-text-muted: #475569; --color-bg: #ffffff; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: var(--color-text); background: var(--color-bg); text-align: center; }
    main { max-width: 36rem; }
    .eyebrow { display: block; font-size: 0.875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-primary); margin-bottom: 0.75rem; }
    h1 { font-size: clamp(1.75rem, 1.4rem + 2vw, 2.5rem); line-height: 1.15; margin-bottom: 1rem; }
    p { color: var(--color-text-muted); margin-bottom: 1.5rem; }
    a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 2.75rem; padding: 0.75em 1.4em; border-radius: 0.75rem; background: var(--color-primary); color: #fff; font-weight: 600; text-decoration: none; }
    a.btn:hover { background: var(--color-primary-strong); }
  </style>
</head>
<body>
  <main id="conteudo">
    <span class="eyebrow">Erro 404</span>
    <h1>Essa página não existe.</h1>
    <p>O endereço pode ter mudado. Volte para a página inicial ou fale com a gente.</p>
    <a class="btn" href="{{https://URL-final-do-site/}}">Ir para a página inicial</a>
  </main>
</body>
</html>
